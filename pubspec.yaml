name: nh_fitness
description: "NH Fitness — gym membership app for web, Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # PRD section 3: path URLs on the web (`usePathUrlStrategy`).
  flutter_web_plugins:
    sdk: flutter

  # Firebase (PRD section 3). Spark plan only: no Functions, no Storage.
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0

  # App plumbing
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  shared_preferences: ^2.5.6

  # Presentation
  cached_network_image: ^4.0.3
  confetti: ^0.8.0
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  youtube_player_iframe: ^6.0.2

  # PRD section 13 asks for a "You are offline" bar but names no package.
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
